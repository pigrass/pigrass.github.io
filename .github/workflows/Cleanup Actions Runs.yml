name: cleanup-runs

on:
  workflow_dispatch:
  schedule:
    # UTC 时间：每 2 天凌晨 00:00 执行一次
    # 等价于：每月 1、3、5、7... 日
    - cron: '0 0 */2 * *'

permissions:
  actions: write
  contents: read

jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs (keep last 2 days)
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
